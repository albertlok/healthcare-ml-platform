name: healthcare_ml
version: "1.0.0"
config-version: 2

profile: healthcare_ml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  run_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"
  lookback_days_short: 30
  lookback_days_long: 90

models:
  healthcare_ml:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate"]
    marts:
      core:
        +materialized: table
        +schema: core
        +tags: ["core", "mart"]
      ml:
        +materialized: table
        +schema: ml
        +tags: ["ml", "mart"]
        +post-hook:
          - "{{ log('ML mart refreshed: ' ~ this, info=true) }}"
