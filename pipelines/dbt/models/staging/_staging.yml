version: 2

sources:
  - name: silver
    description: "Cleaned Delta Lake silver layer tables, loaded into DuckDB before dbt runs."
    schema: silver
    tables:
      - name: appointments
        description: "Deduplicated, cleaned appointment events with DQ flags."
      - name: patients
        description: "SCD Type 2 patient dimension. Filter is_current=true for latest state."

models:
  - name: stg_appointments
    description: "Staging model for appointment events. Applies light casts and renames only."
    columns:
      - name: appointment_id
        description: "UUID of the appointment."
        tests:
          - not_null
          - unique
      - name: patient_id
        description: "UUID of the patient."
        tests:
          - not_null
      - name: provider_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SCHEDULED", "RESCHEDULED", "CANCELLED", "COMPLETED", "NO_SHOW"]
      - name: duration_minutes
        tests:
          - not_null
      - name: is_no_show
        tests:
          - not_null

  - name: stg_patients
    description: "Staging model for current patient records."
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ["MALE", "FEMALE", "NON_BINARY", "PREFER_NOT_TO_SAY", "UNKNOWN"]
      - name: insurance_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["COMMERCIAL", "MEDICARE", "MEDICAID", "SELF_PAY", "WORKERS_COMP", "TRICARE", "UNKNOWN"]
      - name: is_current
        tests:
          - not_null
