[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-ml-platform"
version = "0.1.0"
description = "End-to-end healthcare ML data platform: streaming ingestion, Delta Lake, dbt, Feast, DVC, RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── Kafka ──────────────────────────────────────────────────
    "confluent-kafka[avro,schemaregistry]>=2.4.0",
    "fastavro>=1.9.4",

    # ── Spark + Delta Lake ─────────────────────────────────────
    "pyspark==3.5.1",
    "delta-spark==3.1.0",

    # ── Data warehouse / SQL ───────────────────────────────────
    "duckdb>=0.10.3",
    "snowflake-connector-python>=3.10.0",
    "snowflake-sqlalchemy>=1.6.1",
    "sqlalchemy>=2.0.30",

    # ── dbt ────────────────────────────────────────────────────
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dbt-snowflake>=1.8.0",

    # ── Feature Store ──────────────────────────────────────────
    "feast[duckdb,redis]>=0.40.0",

    # ── MLflow ─────────────────────────────────────────────────
    "mlflow>=2.13.0",
    "boto3>=1.34.0",               # MLflow S3 artifact store

    # ── ML / Data Science ──────────────────────────────────────
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyarrow>=16.1.0",
    "shap>=0.45.1",

    # ── DVC ────────────────────────────────────────────────────
    "dvc>=3.51.0",
    "dvc-s3>=3.2.0",
    "dvc-gdrive>=3.0.0",

    # ── Drift Detection ────────────────────────────────────────
    "evidently>=0.4.30",

    # ── Data Quality ───────────────────────────────────────────
    "great-expectations>=0.18.15",

    # ── RAG / Vector Store ─────────────────────────────────────
    "chromadb>=0.5.3",
    "langchain>=0.2.5",
    "langchain-community>=0.2.5",
    "langchain-anthropic>=0.1.15",
    "sentence-transformers>=3.0.1",

    # ── API ────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.1",

    # ── Synthetic data ─────────────────────────────────────────
    "faker>=25.8.0",

    # ── Logging / Observability ────────────────────────────────
    "structlog>=24.2.0",
    "rich>=13.7.1",

    # ── Config / Utilities ─────────────────────────────────────
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    # ── Testing ────────────────────────────────────────────────
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.7",
    "chispa>=0.9.4",               # PySpark DataFrame testing
    "httpx>=0.27.0",               # FastAPI test client

    # ── Linting / Formatting ───────────────────────────────────
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.1.0",
    "flake8-bugbear>=24.4.26",
    "mypy>=1.10.0",
    "sqlfluff>=3.0.7",
    "pre-commit>=3.7.1",

    # ── Type stubs ─────────────────────────────────────────────
    "types-requests>=2.32.0",
    "pandas-stubs>=2.2.2",
]

airflow = [
    "apache-airflow==2.9.3",
    "apache-airflow-providers-apache-kafka>=1.3.1",
    "apache-airflow-providers-apache-spark>=4.9.0",
    "apache-airflow-providers-snowflake>=5.5.0",
    "apache-airflow-providers-amazon>=8.24.0",
    "apache-airflow-providers-microsoft-azure>=10.1.0",
    "apache-airflow-providers-google>=10.20.0",
    "apache-airflow-providers-slack>=8.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "pipelines*", "feature_store*", "ml*", "rag*"]

# ── Black ─────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.dvc
  | htmlcov
  | pipelines/dbt
)/
'''

# ── isort ─────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["pipelines/dbt/*", ".venv/*"]

# ── flake8 ────────────────────────────────────────────────────
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "pipelines/dbt", "htmlcov"]

# ── mypy ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["pipelines/dbt/", ".venv/"]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that require a running Docker stack",
    "slow: marks tests that take more than 10 seconds",
]
addopts = "-ra -q"
